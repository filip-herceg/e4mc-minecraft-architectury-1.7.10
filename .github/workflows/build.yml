name: Build E4MC Minecraft 1.7.10 Mod

on:
  push:
    branches: [ rererewrite ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ rererewrite ]
  workflow_dispatch: {}

permissions:
  contents: write  # needed to create releases/tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clear Gradle Java Home
        run: |
          if [ -f gradle.properties ]; then
            grep -v "org.gradle.java.home" gradle.properties > gradle.properties.tmp || true
            mv gradle.properties.tmp gradle.properties || true
          fi
          echo "JAVA_HOME is: $JAVA_HOME"
          echo "Java executable: $(which java)"
          java -version

      - name: Setup Decompiled Workspace
        run: ./gradlew clean setupDecompWorkspace --no-daemon --console=plain --stacktrace

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --console=plain --stacktrace

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: e4mc-minecraft-1.7.10-${{ github.sha }}
          path: |
            **/build/libs/*.jar
          retention-days: 15

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: e4mc-minecraft-1.7.10-${{ github.sha }}
          path: artifacts

      - name: Create Release (tagged)
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.jar
          draft: false
          generate_release_notes: true
          name: "E4MC Minecraft 1.7.10 - ${{ github.ref_name }}"
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  nightly:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/rererewrite'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: e4mc-minecraft-1.7.10-${{ github.sha }}
          path: artifacts

      - name: Ensure nightly tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Create or move the 'nightly' tag to this commit and push forcefully
          git tag -f nightly "${GITHUB_SHA}"
          git push -f origin refs/tags/nightly

      - name: Publish Nightly Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: "E4MC Minecraft 1.7.10 - Nightly"
          prerelease: true
          draft: false
          files: artifacts/**/*.jar
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
