name: Build E4MC Minecraft 1.7.10 Mod

on:
  push:
    branches: [ rererewrite ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ rererewrite ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
    
    # Set JAVA_HOME explicitly to avoid Gradle issues
    - name: Set Java Home
      run: |
        echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
        echo "Java version: $(java -version)"
        echo "Java Home: $JAVA_HOME"
    
    # Cache Gradle dependencies to speed up builds
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    # Use setupDecompWorkspace instead of setupDevWorkspace for better compatibility
    - name: Setup Decompiled Workspace
      run: ./gradlew setupDecompWorkspace --no-daemon --console=plain
      env:
        JAVA_HOME: ${{ env.JAVA_HOME }}
    
    - name: Build with Gradle
      run: ./gradlew build --no-daemon --console=plain
      env:
        JAVA_HOME: ${{ env.JAVA_HOME }}
      continue-on-error: true  # Continue even if build fails due to code issues
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: always()  # Upload artifacts even if build had issues
      with:
        name: e4mc-minecraft-1.7.10-${{ github.sha }}
        path: |
          build/libs/*.jar
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
    
    # Cache Gradle dependencies for release build too
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Setup Decompiled Workspace
      run: ./gradlew setupDecompWorkspace --no-daemon --console=plain
    
    - name: Build with Gradle
      run: ./gradlew build --no-daemon --console=plain
      continue-on-error: true
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          build/libs/e4mc_minecraft-1.7.10-*.jar
        draft: false
        generate_release_notes: true
        name: "E4MC Minecraft 1.7.10 - ${{ github.ref_name }}"
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
